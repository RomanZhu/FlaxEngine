name: Release Editor

on:
  push:
    tags:
      - 'editor-*'

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: false
  DOTNET_ROLL_FORWARD: 'minor'
  GIT_LFS_PULL_OPTIONS: '-c lfs.concurrenttransfers=1 -c lfs.transfer.maxretries=2 -c http.version="HTTP/1.1" -c lfs.activitytimeout=60'

jobs:
  package-windows-editor:
    name: Editor (Windows)
    runs-on: "windows-2022"
    steps:
    - name: Checkout repo
      uses: actions/checkout@v6
    - name: Checkout LFS
      run: |
        git lfs version
        git ${{ env.GIT_LFS_PULL_OPTIONS }} lfs pull
    - name: Setup Vulkan
      uses: ./.github/actions/vulkan
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 8.0.419
    - name: Print .NET info
      run: |
        dotnet --info
        dotnet workload --info
    - name: Package editor
      run: |
        PowerShell "(Get-Content global.json).Replace('latestMajor', 'minor') | Set-Content global.json"
        PowerShell "(Get-Content Source/Tools/Flax.Build/global.json).Replace('latestMajor', 'minor') | Set-Content Source/Tools/Flax.Build/global.json"
        PowerShell "(Get-Content Source/Tools/Flax.Build/Flax.Build.csproj).Replace('LatestMajor', 'Minor') | Set-Content Source/Tools/Flax.Build/Flax.Build.csproj"
        .\PackageEditor.bat -arch=x64 -platform=Windows -deployOutput=Output -dotnet=8
    - name: Prepare release assets
      shell: pwsh
      run: |
        $tag = "${{ github.ref_name }}"
        New-Item -ItemType Directory -Force Release
        Copy-Item Output\Editor.zip "Release\FlaxEditor-Windows-x64-$tag.zip"
        Copy-Item Output\EditorDebugSymbols.zip "Release\FlaxEditor-Windows-x64-$tag-DebugSymbols.zip"
    - name: Publish GitHub release
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
        TAG_NAME: ${{ github.ref_name }}
      run: |
        $assets = @(
          "Release/FlaxEditor-Windows-x64-$env:TAG_NAME.zip",
          "Release/FlaxEditor-Windows-x64-$env:TAG_NAME-DebugSymbols.zip"
        )

        $releaseExists = $false
        try
        {
            gh release view $env:TAG_NAME --repo $env:GITHUB_REPOSITORY *> $null
            $releaseExists = $LASTEXITCODE -eq 0
        }
        catch
        {
            $releaseExists = $false
        }

        if ($releaseExists)
        {
            gh release upload $env:TAG_NAME @assets --clobber --repo $env:GITHUB_REPOSITORY
        }
        else
        {
            gh release create $env:TAG_NAME @assets --repo $env:GITHUB_REPOSITORY --title $env:TAG_NAME --notes "Automated Windows editor build for $env:TAG_NAME."
        }
